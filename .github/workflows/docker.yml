name: build-and-push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本（如 1.2.3 或 v1.2.3；留空则只推 main 标签）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag 触发 -> 从 ref 取版本；手动触发 -> 取输入的版本号。
      # 生成 tags: V / major.minor / major / latest；无版本时回退 main。
      # 注意：镜像名必须全小写（owner 可能含大写，如 SJJ-dot -> sjj-dot）
      - name: 计算镜像标签
        id: ver
        run: |
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/tv-control"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/}"; V="${V#v}"
          else
            V="${{ github.event.inputs.version }}"; V="${V#v}"
          fi
          if [ -z "$V" ]; then
            echo "tags=${IMAGE}:main" >> "$GITHUB_OUTPUT"
            echo "version=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$V" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::版本格式非法: '$V'（应为 1.2.3 / 1.2 / 1）"
            exit 1
          fi
          MM="${V%.*}"
          M="${V%%.*}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${V}"
            if [ "$MM" != "$V" ]; then echo "${IMAGE}:${MM}"; fi
            if [ "$M" != "$V" ]; then echo "${IMAGE}:${M}"; fi
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
